<head>

    <meta name="DCC202 CSS Em Linhas" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Embutido</title>
    <style>
        em {
        color: orange;
        text-decoration: underline;
        }
        code {
        color: lime; 
        text-decoration: dotted;
        }
    </style>
</head>

<body>
    <main> 
        <h1>DCC202 CSS Embutido <em>é aplicado em style dentro do head</em></h1>
        <ol>
            <li><code>Hello</code></li>
            <li><code>ABRA CADABRA</code></li>
        </ol>
    </main>
</body>
